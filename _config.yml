# Site settings. GitHub Pages builds this repository with Jekyll.
# index.html, resume.html and 404.html are plain HTML; Markdown pages use _layouts/.
title: Mostafa Rafiur Wasib
description: AI Project Lead and AI Engineer in St. John's, NL. Applied AI, business analysis, data and cloud delivery.
url: https://mrw-soumik.github.io
baseurl: ""
lang: en_CA
locale: en_CA
author:
  name: Mostafa Rafiur Wasib
  url: https://mrw-soumik.github.io/
image: /assets/img/og-image.png
logo: /apple-touch-icon.png
social:
  name: Mostafa Rafiur Wasib
  links:
    - https://www.linkedin.com/in/mostafa-wasib/
    - https://github.com/mrw-soumik

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
